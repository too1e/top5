<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOP 5</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2318181B'/><text x='50%25' y='24' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-size='22' font-weight='900' fill='%2322C55E'>5</text></svg>"/>
  <!-- command: Press Start 2P + Courier Prime -->
  <!-- deepnavy: Orbitron + Share Tech Mono -->
  <!-- chrome: Bebas Neue + Space Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=VT323&family=Nunito:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { }

    /* ── GAMEBOY ── dark steel + amber gold (original command) ────── */
    [data-theme="gameboy"] {
      --font-pixel: 'Press Start 2P', 'Courier New', monospace;
      --font-body:  'Courier Prime', 'Courier New', Courier, monospace;
      --bg:            #0B0D13;
      --surface:       #111620;
      --surface2:      #192030;
      --surface3:      #22303F;
      --border-color:  #2C4068;
      --border:        1px solid #2C4068;
      --text:          #D8E8F8;
      --text-dim:      #607898;
      --accent:        #4E8EC4;
      --gold:          #C4A44A;
      --correct-bg:    rgba(196,164,74,0.07);
      --correct-b:     #C4A44A;
      --correct-t:     #D4B45A;
      --wrong-bg:      rgba(176,64,54,0.07);
      --wrong-b:       #B04038;
      --wrong-t:       #C85850;
      --wrong-chip-bg: rgba(176,64,54,0.12);
      --wrong-chip-b:  #B04038;
      --wrong-chip-t:  #D06060;
      --btn:           #3A6E9C;
      --btn-t:         #D8E8F8;
      --btn-h:         #5090C8;
      --input-bg:      #0D1118;
      --input-b:       #2C4068;
      --sugg-bg:       #111620;
      --sugg-h:        #192030;
      --radius:        4px;
      --glow-accent:   0 0 10px rgba(78,142,196,0.3);
      --glow-correct:  0 0 10px rgba(196,164,74,0.25);
      --glow-btn:      0 0 10px rgba(78,142,196,0.35);
    }

    /* ── DEEP NAVY ── near-black blue + ice teal ────────────────── */
    [data-theme="deepnavy"] {
      --font-pixel: 'Rajdhani', sans-serif;
      --font-body:  'Rajdhani', sans-serif;
      --bg:            #050912;
      --surface:       #0A1020;
      --surface2:      #0E182C;
      --surface3:      #142038;
      --border-color:  transparent;
      --border:        1px solid transparent;
      --text:          #A8C8E8;
      --text-dim:      #5A80A8;
      --accent:        #2E88C0;
      --gold:          #48AAD8;
      --correct-bg:    rgba(72,170,216,0.07);
      --correct-b:     #48AAD8;
      --correct-t:     #58BAE8;
      --wrong-bg:      rgba(120,48,80,0.1);
      --wrong-b:       #783050;
      --wrong-t:       #A04870;
      --wrong-chip-bg: rgba(120,48,80,0.14);
      --wrong-chip-b:  #783050;
      --wrong-chip-t:  #C06888;
      --btn:           #1E6898;
      --btn-t:         #A8C8E8;
      --btn-h:         #2E88C0;
      --input-bg:      #080E1A;
      --input-b:       transparent;
      --sugg-bg:       #0A1020;
      --sugg-h:        #0E182C;
      --radius:        14px;
      --glow-accent:   0 0 12px rgba(46,136,192,0.25);
      --glow-correct:  0 0 12px rgba(72,170,216,0.2);
      --glow-btn:      0 0 10px rgba(46,136,192,0.3);
    }


    /* ── BASE ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    /* Subtle background textures */
    [data-theme="gameboy"] body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 3px),
        radial-gradient(circle, rgba(78,142,196,0.04) 1px, transparent 1px);
      background-size: 100% 3px, 28px 28px;
    }
    [data-theme="deepnavy"] body::before { display: none; }

    /* ── LAYOUT ────────────────────────────────────────────────── */
    #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 10px 40px; position: relative; z-index: 1; }
    .game { width: 100%; max-width: min(680px, 98vw); display: flex; flex-direction: column; gap: 16px; }

    /* ── MOBILE: title → question → input → lives → answers ───── */
    @media (max-width: 479px) {
      .game { gap: 12px; }
      .header { margin-bottom: -6px; } /* tighten space to question box */
      .logo        { font-size: clamp(32px, 11vw, 48px) !important; }
      .q-card      { order: 1; }
      .input-wrap  { order: 2; }
      .lives-row   { order: 3; }
      .answer-board{ order: 4; }
      #wrong-wrap  { order: 5; }
      .show-result-btn { order: 6; }
      .replay-wrap { order: 7; }
      .footer      { order: 8; }
    }
    /* hide search input clear button (×) on WebKit */
    .guess-input[type="search"]::-webkit-search-cancel-button { display: none; }

    /* ── THEME SELECTOR (fixed) ────────────────────────────────── */
    .theme-select {
      position: fixed; top: 16px; right: 16px; z-index: 500;
      font-family: var(--font-pixel); font-size: 7px;
    }
    .theme-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2); color: var(--text-dim);
      border: var(--border); border-radius: var(--radius);
      padding: 8px 14px; cursor: pointer;
      font-family: var(--font-pixel); font-size: 12px; letter-spacing: 0.5px;
      transition: all 0.15s; white-space: nowrap;
    }
    .theme-btn:hover { color: var(--accent); box-shadow: var(--glow-accent); }
    .theme-arrow { font-size: 15px; }
    .theme-menu {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      background: var(--surface); border: var(--border); border-radius: var(--radius);
      min-width: 148px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    }
    .theme-menu.open { display: block; }
    .theme-option {
      padding: 10px 14px; color: var(--text-dim); cursor: pointer;
      letter-spacing: 0.5px; transition: all 0.1s;
      border-bottom: var(--border);
    }
    .theme-option:last-child { border-bottom: none; }
    .theme-option:hover { background: var(--surface2); color: var(--accent); }
    .theme-option.active { color: var(--accent); background: var(--surface2); }

    /* ── HEADER ────────────────────────────────────────────────── */
    .header { text-align: center; padding-bottom: 2px; }
    .logo {
      font-family: var(--font-pixel);
      font-size: clamp(22px, 6vw, 32px);
      color: var(--accent);
      letter-spacing: 5px;
      margin-bottom: 3px;
      text-shadow: var(--glow-accent);
    }
    .test-badge {
      font-family: var(--font-pixel); font-size: 6px;
      color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px;
    }
    .header-clock {
      font-family: var(--font-pixel); font-size: 8px;
      color: var(--text-dim); letter-spacing: 3px;
      margin: 3px 0 2px;
    }
    .date-nav {
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px;
    }
    .nav-btn {
      font-family: var(--font-pixel); font-size: 9px;
      background: var(--surface2); color: var(--text);
      border: var(--border); border-radius: var(--radius);
      padding: 5px 11px; cursor: pointer; transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--surface3); color: var(--accent); box-shadow: var(--glow-accent); }
    .nav-btn:disabled { opacity: 0.28; cursor: default; }
    .date-label {
      font-family: var(--font-pixel); font-size: 9px; color: var(--text-dim);
      letter-spacing: 1px; min-width: 84px; text-align: center;
    }

    /* ── QUESTION CARD ─────────────────────────────────────────── */
    .q-card {
      background: var(--surface);
      border: var(--border);
      border-radius: var(--radius);
      padding: 20px 24px; text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .q-category {
      font-family: var(--font-pixel); font-size: 7px;
      color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
      text-shadow: var(--glow-accent);
    }
    .q-text { font-family: var(--font-pixel); font-size: clamp(10px, 2.8vw, 13px); color: var(--text); line-height: 1.9; }

    /* ── LIVES ─────────────────────────────────────────────────── */
    .lives-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .lives-label { font-family: var(--font-pixel); font-size: 8px; color: var(--text-dim); }
    .lives-icons { display: flex; gap: 8px; align-items: center; }
    .life-icon { font-size: 30px; line-height: 1; display: inline-block; transition: opacity 0.3s; }
    .life-icon.lost { opacity: 0.15; filter: grayscale(1); }

    /* ── ANSWER BOARD ──────────────────────────────────────────── */
    .answer-board { display: flex; flex-direction: column; gap: 6px; }
    .slot-hidden {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .slot-rank { font-family: var(--font-pixel); font-size: 11px; color: var(--text-dim); min-width: 32px; text-align: right; }
    .slot-bar { height: 9px; background: var(--surface2); border-radius: 2px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.7} }

    .slot-revealed {
      background: var(--correct-bg); border: 1px solid var(--correct-b);
      border-radius: var(--radius); padding: 18px 20px;
      animation: revealIn 0.3s ease-out; transform-origin: top;
      box-shadow: var(--glow-correct);
    }
    .slot-missed {
      background: var(--wrong-bg); border: 1px solid var(--wrong-b);
      border-radius: var(--radius); padding: 18px 20px;
      animation: revealIn 0.3s ease-out;
    }
    @keyframes revealIn { from{opacity:0;transform:scaleY(.5)} to{opacity:1;transform:scaleY(1)} }

    .slot-inner { display: flex; align-items: flex-start; gap: 12px; }
    .slot-rank-rev { font-family: var(--font-pixel); font-size: 11px; min-width: 32px; text-align: right; margin-top: 2px; }
    .slot-revealed .slot-rank-rev { color: var(--correct-t); }
    .slot-missed  .slot-rank-rev { color: var(--wrong-t); }
    .slot-content { flex: 1; min-width: 0; }
    .slot-name-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .slot-name { font-family: var(--font-pixel); font-size: 13px; color: var(--text); }
    .slot-primary { font-family: var(--font-pixel); font-size: 11px; }
    .slot-revealed .slot-primary { color: var(--correct-t); }
    .slot-missed  .slot-primary { color: var(--text-dim); }
    .slot-got-it { font-family: var(--font-pixel); font-size: 9px; color: var(--correct-t); margin-left: auto; text-shadow: var(--glow-correct); }
    .slot-stats { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; }
    .slot-stat { font-size: 11px; }
    .slot-stat-lbl { color: var(--text-dim); }
    .slot-revealed .slot-stat-val { color: var(--text); }
    .slot-missed  .slot-stat-val { color: var(--text-dim); }

    /* ── INPUT ─────────────────────────────────────────────────── */
    .input-wrap { position: relative; }
    .guess-form { display: flex; gap: 8px; }
    .guess-input {
      flex: 1; padding: 12px 14px;
      font-family: var(--font-body); font-size: 16px; /* 16px prevents iOS zoom */
      background: var(--input-bg); color: var(--text);
      border: var(--border); border-radius: var(--radius);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .guess-input::placeholder { color: var(--text-dim); }
    .guess-input:focus { border-color: var(--accent); box-shadow: var(--glow-accent); }
    .guess-input.shake { animation: shake .45s ease-in-out; border-color: var(--wrong-b) !important; }
    .guess-btn {
      font-family: var(--font-pixel); font-size: 9px; letter-spacing: 1px;
      background: var(--btn); color: var(--btn-t);
      border: none; border-radius: var(--radius);
      padding: 0 16px; cursor: pointer; white-space: nowrap;
      transition: background .15s, box-shadow .15s;
    }
    .guess-btn:hover:not(:disabled) { background: var(--btn-h); box-shadow: var(--glow-btn); }
    .guess-btn:disabled { opacity: .4; cursor: default; }

    /* ── SUGGESTIONS ───────────────────────────────────────────── */
    .suggestions {
      display: none; position: absolute; top: calc(100% + 4px); left: 0;
      width: calc(100% - 88px);
      background: var(--sugg-bg); border: var(--border); border-radius: var(--radius);
      overflow: hidden; z-index: 50; box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    }
    .sugg-item { padding: 10px 14px; font-size: 12px; font-family: var(--font-body); color: var(--text); cursor: pointer; transition: background .1s; }
    .sugg-item:hover, .sugg-item.active { background: var(--sugg-h); }
    .sugg-match { color: var(--accent); font-weight: bold; }
    .wb-word { display:inline-block; padding:4px 10px; border-radius:4px; font-size:12px; font-family:var(--font-body); background:var(--surface2); border:var(--border); color:var(--text-dim); }
    .wb-word.wb-ans { border-color:var(--accent); color:var(--text); }
    .wb-word.wb-got { background:var(--correct-bg); border-color:var(--correct-b); color:var(--correct-t); }

    /* ── FEEDBACK ──────────────────────────────────────────────── */
    .feedback { font-family: var(--font-pixel); font-size: 8px; text-align: center; min-height: 20px; letter-spacing: 1px; }
    .feedback.wrong { color: var(--wrong-t); }
    .feedback.dupe  { color: var(--accent); }
    .feedback.show  { animation: fadeUp .25s ease-out; }

    /* ── WRONG GUESSES ─────────────────────────────────────────── */
    .wrong-label { font-family: var(--font-pixel); font-size: 7px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .wrong-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .wrong-chip {
      font-size: 11px; font-family: var(--font-body);
      padding: 4px 10px; border-radius: var(--radius);
      background: var(--wrong-chip-bg); border: 1px solid var(--wrong-chip-b); color: var(--wrong-chip-t);
    }

    /* ── RESULT PANEL ──────────────────────────────────────────── */
    .result-panel { border-radius: var(--radius); padding: 22px; text-align: center; animation: fadeUp .3s ease-out; }
    .result-panel.win  { background: var(--correct-bg); border: 1px solid var(--correct-b); box-shadow: var(--glow-correct); }
    .result-panel.lose { background: var(--wrong-bg);   border: 1px solid var(--wrong-b); }
    .result-icon  { font-size: 42px; margin-bottom: 10px; display: block; animation: popIn .4s ease-out; }
    .result-title { font-family: var(--font-pixel); font-size: 12px; margin-bottom: 8px; }
    .result-panel.win  .result-title { color: var(--correct-t); text-shadow: var(--glow-correct); }
    .result-panel.lose .result-title { color: var(--wrong-t); }
    .result-sub   { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    .result-lives { display: flex; justify-content: center; gap: 6px; align-items: center; margin-bottom: 12px; }
    .share-btn {
      width: 100%; font-family: var(--font-pixel); font-size: 9px; letter-spacing: 1px;
      background: var(--btn); color: var(--btn-t);
      border: none; border-radius: var(--radius); padding: 14px; cursor: pointer;
      transition: background .15s, box-shadow .15s; margin-top: 6px;
    }
    .share-btn:hover { background: var(--btn-h); box-shadow: var(--glow-btn); }
    .next-day-nav { display: flex; gap: 8px; margin-top: 10px; }
    .next-day-btn {
      flex: 1; font-family: var(--font-pixel); font-size: 7px; letter-spacing: .5px;
      background: var(--surface2); color: var(--text-dim);
      border: var(--border); border-radius: var(--radius); padding: 10px; cursor: pointer;
      transition: all .15s;
    }
    .next-day-btn:hover:not(:disabled) { color: var(--accent); box-shadow: var(--glow-accent); }
    .next-day-btn:disabled { opacity: .28; cursor: default; }

    /* ── REPLAY / FOOTER ───────────────────────────────────────── */
    .replay-wrap { display: flex; justify-content: center; margin-top: 8px; }
    .replay-btn {
      font-family: var(--font-pixel); font-size: 7px; letter-spacing: 1px;
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border-color); border-radius: var(--radius);
      padding: 6px 12px; cursor: pointer; opacity: .45; transition: all .15s;
    }
    .replay-btn:hover { color: var(--wrong-t); border-color: var(--wrong-b); opacity: 1; }
    .footer { font-family: var(--font-pixel); font-size: 7px; color: var(--text-dim); text-align: center; margin-top: 16px; opacity: .4; letter-spacing: 1px; }

    /* ── CLICKABLE TILES ───────────────────────────────────────── */
    .slot-clickable { cursor: pointer; transition: filter .15s, box-shadow .15s; position: relative; }
    .slot-clickable:hover { filter: brightness(1.12); }
    .slot-clickable::after {
      content: '↗'; position: absolute; top: 9px; right: 11px;
      font-size: 9px; color: var(--accent); opacity: 0; transition: opacity .15s;
      font-family: var(--font-body);
    }
    .slot-clickable:hover::after { opacity: 0.55; }

    /* ── MAP MODAL ─────────────────────────────────────────────── */
    .map-modal {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,0.82); align-items: center; justify-content: center;
    }
    .map-modal.open { display: flex; animation: fadeUp .15s ease-out; }
    .map-container {
      width: min(520px, 94vw); height: min(440px, 82vh);
      display: flex; flex-direction: column;
      background: var(--surface); border: var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }
    .map-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--surface2); border-bottom: var(--border);
      flex-shrink: 0;
    }
    .map-label {
      font-family: var(--font-pixel); font-size: 8px; color: var(--accent); letter-spacing: 1px;
    }
    .map-close {
      background: none; border: 1px solid var(--border-color); color: var(--text-dim);
      cursor: pointer; font-size: 13px; padding: 2px 8px; border-radius: var(--radius);
      transition: all .15s; font-family: var(--font-body);
    }
    .map-close:hover { color: var(--text); border-color: var(--text-dim); }
    #mapLeaflet { flex: 1; }
    /* map button inside revealed slots */
    .map-btn {
      font-family: var(--font-pixel); font-size: 7px; letter-spacing: 0.5px;
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      border-radius: var(--radius); padding: 4px 9px; cursor: pointer;
      margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
      transition: all .15s;
    }
    .map-btn:hover { background: var(--accent); color: var(--bg); }
    /* leaflet overrides */
    .leaflet-container { background: #080d14 !important; font-family: var(--font-body) !important; }
    /* dark-theme tile inversion — makes OSM tiles read as dark maps */
    [data-theme="gameboy"] .leaflet-tile-pane,
    [data-theme="deepnavy"] .leaflet-tile-pane,
    [data-theme="chrome"] .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(0.88) contrast(0.9); }
    .leaflet-popup-content-wrapper {
      background: var(--surface2) !important; border: 1px solid var(--border-color) !important;
      border-radius: var(--radius) !important; color: var(--text) !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important;
    }
    .leaflet-popup-tip { background: var(--surface2) !important; }
    .leaflet-popup-content { font-family: var(--font-pixel) !important; font-size: 8px !important; margin: 8px 12px !important; color: var(--accent) !important; letter-spacing: 0.5px; }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }
    .leaflet-control-zoom a { background: var(--surface2) !important; color: var(--text) !important; border-color: var(--border-color) !important; }
    .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: var(--text-dim) !important; font-size: 9px !important; }
    /* pin marker */
    .map-pin {
      width: 14px; height: 14px; background: #FF6B35; border: 2px solid #fff;
      border-radius: 50%; box-shadow: 0 0 14px rgba(255,107,53,0.8), 0 2px 4px rgba(0,0,0,0.5);
      animation: mapPinPop .35s cubic-bezier(.17,.67,.3,1.4);
    }
    @keyframes mapPinPop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

    /* ── DETAIL MODAL ──────────────────────────────────────────── */
    .detail-modal {
      display: none; position: fixed; inset: 0; z-index: 850;

<script>


// ═══════════════════════════════════════════════════════════════
//  CALENDAR CONFIG
// ═══════════════════════════════════════════════════════════════

const EPOCH = '2026-06-11'; // question 1 = today, extends forward

function dateStr(d)        { return d.toISOString().split('T')[0]; }
function parseDate(s)      { return new Date(s+'T12:00:00'); }
function offsetFromEpoch(s){ return Math.round((parseDate(s)-parseDate(EPOCH))/86400000); }
function dateOfOffset(n)   { const d=parseDate(EPOCH); d.setDate(d.getDate()+n); return dateStr(d); }
function questionIndex(s)  { return ((offsetFromEpoch(s) % QUESTIONS.length) + QUESTIONS.length) % QUESTIONS.length; }
function fmtDate(s)        {
  return parseDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

const todayStr = dateStr(new Date());
let currentDate = todayStr;

// ── User / session identity ──────────────────────────────────────
function getOrCreate(storage, key) {
  try {
    let v = storage.getItem(key);
    if (!v) { v = crypto.randomUUID(); storage.setItem(key, v); }
    return v;
  } catch { return 'unknown'; }
}
const USER_ID    = getOrCreate(localStorage,  'top5_uid');
const SESSION_ID = getOrCreate(sessionStorage, 'top5_sid');

function getQuestion() { return QUESTIONS[questionIndex(currentDate)]; }

// ═══════════════════════════════════════════════════════════════
//  MATCHING
// ═══════════════════════════════════════════════════════════════

function norm(s) { return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim(); }
function matches(inp, ans) {
  const i=norm(inp); if(i.length<2) return false;
  const n=norm(ans.name), al=(ans.aliases||[]).map(norm);
  if(n===i||al.includes(i)) return true;
  if(i.length>=3&&(n.startsWith(i)||al.some(a=>a.startsWith(i)))) return true;
  const iw=i.split(' ').filter(w=>w.length>0), nw=n.split(' ');
  if(iw.length>=1&&iw.every(w=>nw.some(x=>x.startsWith(w)))) {
    if(iw.length===1&&iw[0].length<4) return false; return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════

const SK = d => 'top5test-'+d;
function blank(q) { return {qid:q.id,revealed:[],wrong:[],lives:3,status:'playing'}; }
function loadState(q) {
  try{const r=localStorage.getItem(SK(currentDate));if(r){const s=JSON.parse(r);if(s.qid===q.id)return s;}}catch(e){}
  return blank(q);
}
function save() { try{localStorage.setItem(SK(currentDate),JSON.stringify(state));}catch(e){} }
let state = loadState(getQuestion());

// ═══════════════════════════════════════════════════════════════
//  PLAYER / CAREER STATS
// ═══════════════════════════════════════════════════════════════

function genId() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x' ? r : (r&0x3|0x8)).toString(16);
  });
}

const PLAYER_KEY = 'top5-player';

function loadPlayer() {
  try {
    const p = JSON.parse(localStorage.getItem(PLAYER_KEY)||'null');
    if (p && p.id) {
      // ensure all fields exist (for old saves)
      p.guessDistribution = p.guessDistribution||[0,0,0,0,0,0];
      p.totalCorrect = p.totalCorrect||0;
      return p;
    }
  } catch(e) {}
  return {
    id: genId(), created: todayStr,
    playStreak:0, playStreakBest:0, playStreakLastDate:null,
    winStreak:0,  winStreakBest:0,  winStreakLastDate:null,
    gamesPlayed:0, gamesWon:0, totalCorrect:0,
    guessDistribution:[0,0,0,0,0,0],
    lastRecordedDate:null,
  };
}
function savePlayer(p) { try{localStorage.setItem(PLAYER_KEY,JSON.stringify(p));}catch(e){} }

let player = loadPlayer();

function updateCareerStats(st, forDate) {
  if (player.lastRecordedDate === forDate) return; // already recorded today
  const p = {...player};
  p.guessDistribution = [...(p.guessDistribution||[0,0,0,0,0,0])];
  const won = st.status === 'won';
  const correct = st.revealed.length;

  p.gamesPlayed++;
  if (won) p.gamesWon++;
  p.totalCorrect += correct;
  p.guessDistribution[correct] = (p.guessDistribution[correct]||0) + 1;

  // compute yesterday string relative to forDate
  const fd = new Date(forDate+'T12:00:00');
  fd.setDate(fd.getDate()-1);
  const yest = fd.toISOString().split('T')[0];

  // play streak
  if (p.playStreakLastDate === yest) { p.playStreak++; }
  else if (p.playStreakLastDate === forDate) { /* same day, no change */ }
  else { p.playStreak = 1; }
  if (p.playStreakLastDate !== forDate) p.playStreakLastDate = forDate;
  p.playStreakBest = Math.max(p.playStreakBest, p.playStreak);

  // win streak
  if (won) {
    if (p.winStreakLastDate === yest) { p.winStreak++; }
    else if (p.winStreakLastDate === forDate) { /* same day */ }
    else { p.winStreak = 1; }
    if (p.winStreakLastDate !== forDate) p.winStreakLastDate = forDate;
    p.winStreakBest = Math.max(p.winStreakBest, p.winStreak);
  } else {
    p.winStreak = 0;
  }

  p.lastRecordedDate = forDate;
  player = p;
  savePlayer(p);
}

function populationVizSVG(countryName, rank) {
  const history = POP_DATA[countryName];
  if (!history) return '<svg></svg>';
  const W = 520, H = 290, mL = 48, mR = 18, mT = 44, mB = 46;
  const cW = W - mL - mR, cH = H - mT - mB;
  const maxVal = Math.max(...history.map(d => d[1])) * 1.08;
  const xS = i => mL + (i / (history.length - 1)) * cW;
  const yS = v => mT + cH - (v / maxVal) * cH;
  const els = [];
  for (const g of [250, 500, 750, 1000, 1250]) {
    if (g > maxVal) continue;
    const gy = yS(g);
    els.push(`<line x1="${mL}" y1="${gy.toFixed(1)}" x2="${W-mR}" y2="${gy.toFixed(1)}" stroke="#222" stroke-width="1" stroke-dasharray="4,8"/>`);
    els.push(`<text x="${mL-5}" y="${(gy+4).toFixed(1)}" text-anchor="end" font-family="monospace" font-size="8" fill="#444">${g}M</text>`);
  }
  const pts = history.map((d,i) => `${xS(i).toFixed(1)},${yS(d[1]).toFixed(1)}`).join(' ');
  const area = [`${xS(0).toFixed(1)},${(mT+cH).toFixed(1)}`, ...history.map((d,i) => `${xS(i).toFixed(1)},${yS(d[1]).toFixed(1)}`), `${xS(history.length-1).toFixed(1)},${(mT+cH).toFixed(1)}`].join(' ');
  els.push(`<polygon points="${area}" fill="rgba(200,200,200,0.05)"/>`);
  els.push(`<polyline points="${pts}" fill="none" stroke="#777" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
  history.forEach((d, i) => {
    const cx = xS(i).toFixed(1), cy = yS(d[1]).toFixed(1);
    const last = i === history.length - 1, first = i === 0;
    els.push(`<circle cx="${cx}" cy="${cy}" r="${last ? 5 : 3}" fill="${last ? '#DDD' : '#555'}" stroke="${last ? '#FFF' : '#777'}" stroke-width="${last ? 1.5 : 1}"/>`);
    if (i % 2 === 0 || last) {
      els.push(`<text x="${cx}" y="${(mT+cH+15).toFixed(1)}" text-anchor="middle" font-family="monospace" font-size="8" fill="${last ? '#AAA' : '#4A4A4A'}">${d[0]}</text>`);
    }
    if (last || first) {
      const anchor = last ? 'end' : 'start', ox = last ? -8 : 8;
      els.push(`<text x="${(parseFloat(cx)+ox).toFixed(1)}" y="${(parseFloat(cy)-9).toFixed(1)}" text-anchor="${anchor}" font-family="monospace" font-size="10" fill="${last ? '#DDD' : '#666'}" font-weight="bold">${d[1]}M</text>`);
    }
  });
  els.push(`<line x1="${mL}" y1="${(mT+cH).toFixed(1)}" x2="${W-mR}" y2="${(mT+cH).toFixed(1)}" stroke="#333" stroke-width="1.5"/>`);
  els.push(`<text x="${W/2}" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#AAA" font-weight="bold" letter-spacing="2">${countryName.toUpperCase()} · POPULATION GROWTH</text>`);
  if (rank) els.push(`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-family="monospace" font-size="9" fill="#444" letter-spacing="1">RANK #${rank} MOST POPULOUS · SOURCES: UN WORLD POPULATION PROSPECTS</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#07090F;display:block;">${els.join('')}</svg>`;
}

  const slots = q.answers.map((_,i) => state.revealed.includes(i) ? '🟩' : '⬛').join('');

function updateCountdown() {
  const el = document.getElementById('rmCountdown'); if (!el) return;
  const now = new Date();
  const etStr = now.toLocaleString('en-US', {timeZone:'America/New_York', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  const [h, m, s] = etStr.split(':').map(Number);
  const secs = (24 * 3600) - (h * 3600 + m * 60 + s);
  el.textContent = `${String(Math.floor(secs/3600)).padStart(2,'0')}:${String(Math.floor((secs%3600)/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

  // color by score: 0=grey, 1=red, 2=orange, 3=yellow, 4=light green, 5=pure green
  const bgColors   = ['#0A0A0A','#1A0A0A','#1A100A','#1A1A0A','#0D1F0D','#0D2A12'];

  const titles = { 5: perfect ? 'FLAWLESS.' : 'YOU GOT ALL 5!', 4: 'SO CLOSE.', 3: 'HALFWAY THERE.', 2: 'ROUGH ONE.', 1: 'JUST ONE.', 0: 'SHUT OUT.' };
  const subs   = { 5: perfect ? 'No wrong guesses — perfect game!' : `All 5 correct with ${state.wrong.length} wrong guess${state.wrong.length!==1?'es':''}`, 4: 'One slipped away.', 3: 'Three out of five.', 2: `Only ${score} correct — come back tomorrow.`, 1: 'One and done — better luck next time.', 0: 'No correct answers. Tomorrow is a new day.' };

  }).join('');
  document.getElementById('rmStats').innerHTML = buildStatsHTML(state);
  document.getElementById('resultModal').classList.add('open');
  updateCountdown();
  if (_countdownInterval) clearInterval(_countdownInterval);
  _countdownInterval = setInterval(updateCountdown, 1000);
};

window.closeResult = function() {
  document.getElementById('resultModal').classList.remove('open');
  if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }
};

// ═══════════════════════════════════════════════════════════════
//  THEME
// ═══════════════════════════════════════════════════════════════

document.body.dataset.theme = 'gameboy';

// ═══════════════════════════════════════════════════════════════
//  SUGGESTIONS
// ═══════════════════════════════════════════════════════════════

let activeIdx = -1;
let adminMode = false;

function getSugg(val, q) {
  if(!val||val.length<2) return [];
  if(val.startsWith('/')) return [];
  const n=norm(val);
  return (q.pool||[]).filter(x=>norm(x).includes(n)).sort((a,b)=>(norm(a).startsWith(n)?0:1)-(norm(b).startsWith(n)?0:1)||a.localeCompare(b)).slice(0,6);
}
function hl(name, q) {
  const i=name.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return name;
  return name.slice(0,i)+'<span class="sugg-match">'+name.slice(i,i+q.length)+'</span>'+name.slice(i+q.length);
}
function showSugg(val, q) {
  const box=document.getElementById('sugg'); if(!box) return;
  const items=getSugg(val,q); activeIdx=-1;
  if(!items.length){box.style.display='none';return;}
  box.innerHTML=items.map((nm,i)=>`<div class="sugg-item" data-idx="${i}" data-name="${nm.replace(/"/g,'&quot;')}" onmousedown="pickSugg(event)">${hl(nm,val)}</div>`).join('');
  box.style.display='block';
}
function hideSugg(){const b=document.getElementById('sugg');if(b)b.style.display='none';activeIdx=-1;}
window.pickSugg = function(e){e.preventDefault();const nm=e.currentTarget.dataset.name;const inp=document.getElementById('gi');if(inp&&nm){inp.value=nm;hideSugg();doGuess(nm);}};

// ═══════════════════════════════════════════════════════════════
//  PARTIAL DOM UPDATES
// ═══════════════════════════════════════════════════════════════

function lifeHTML() {
  const q=getQuestion();
  return Array.from({length:3},(_,i)=>`<span class="life-icon${i<state.lives?'':' lost'}">${q.emoji}</span>`).join('');
}
function updateLives(){const el=document.getElementById('lives');if(el){el.innerHTML=lifeHTML();}}
function updateWrong(){
  const el=document.getElementById('wrong-wrap');if(!el)return;
  el.innerHTML=state.wrong.length?`<div class="wrong-label">Wrong guesses</div><div class="wrong-chips">${state.wrong.map(g=>`<span class="wrong-chip">${g}</span>`).join('')}</div>`:'';
}
function updateBoard(){
  const el=document.getElementById('board');if(!el)return;
  const q=getQuestion();
  el.innerHTML=q.answers.map((ans,i)=>{const got=state.revealed.includes(i),miss=state.status!=='playing'&&!got;return(got||miss)?slotRevHTML(i+1,ans,got,miss):slotHidHTML(i+1);}).join('');
}

// ═══════════════════════════════════════════════════════════════
//  HTML BUILDERS
// ═══════════════════════════════════════════════════════════════

function slotHidHTML(rank) {
  return `<div class="slot-hidden"><span class="slot-rank">#${rank}</span><div style="flex:1;display:flex;gap:8px"><div class="slot-bar" style="width:${100+rank*20}px"></div><div class="slot-bar" style="width:68px;opacity:.45"></div></div></div>`;
}
function slotRevHTML(rank, ans, got, miss) {
  const cls=got?'slot-revealed':'slot-missed';
  const stats=ans.stats.map(([l,v])=>`<span class="slot-stat"><span class="slot-stat-lbl">${l}: </span><span class="slot-stat-val">${v}</span></span>`).join('');
  return `<div class="${cls} slot-clickable" onclick="tileClick(${rank-1})"><div class="slot-inner"><span class="slot-rank-rev">#${rank}</span><div class="slot-content"><div class="slot-name-row"><span class="slot-name">${ans.name}</span><span class="slot-primary">${ans.primary}</span>${got?'<span class="slot-got-it">✓ GOT IT</span>':''}</div><div class="slot-stats">${stats}</div></div></div></div>`;
}

// ═══════════════════════════════════════════════════════════════
//  FULL RENDER
// ═══════════════════════════════════════════════════════════════

function render() {
  const q=getQuestion(), over=state.status!=='playing';
  const boardHTML=q.answers.map((ans,i)=>{const got=state.revealed.includes(i),miss=over&&!got;return(got||miss)?slotRevHTML(i+1,ans,got,miss):slotHidHTML(i+1);}).join('');
  const livesHtml=Array.from({length:3},(_,i)=>`<span class="life-icon${i<state.lives?'':' lost'}">${q.emoji}</span>`).join('');
  const wrongHtml=state.wrong.length?`<div class="wrong-label">Wrong guesses</div><div class="wrong-chips">${state.wrong.map(g=>`<span class="wrong-chip">${g}</span>`).join('')}</div>`:'';

  document.getElementById('app').innerHTML = `<div class="game">
    <div class="header">
      <h1 class="logo">TOP 5</h1>
      <div class="header-clock" id="headerClock">--:--:--</div>
      <div class="date-nav">
        ${adminMode?`<button class="nav-btn" onclick="navDate(-1)">◀</button>`:''}
        <span class="date-label">${fmtDate(currentDate)}</span>
        ${adminMode?`<button class="nav-btn" onclick="navDate(1)">▶</button>`:''}
        ${adminMode?`<button class="nav-btn" style="margin-left:8px;font-size:9px;" onclick="openWordBank()">BANK</button>`:''}
        ${adminMode?`<a href="https://api.top5trivia.com/dashboard?secret=${encodeURIComponent('top5admin2026')}" target="_blank" class="nav-btn" style="margin-left:4px;font-size:9px;text-decoration:none;">STATS</a>`:''}

      </div>
    </div>
    <div class="q-card">
      <div class="q-category">${q.category}</div>
      <div class="q-text">${q.question}</div>
    </div>
    ${!over?`<div class="lives-row"><span class="lives-label">LIVES:</span><div class="lives-icons" id="lives">${livesHtml}</div></div>`:''}
    <div class="answer-board" id="board">${boardHTML}</div>
    ${!over?`<div class="input-wrap"><form class="guess-form" id="gf" onsubmit="return false"><input id="gi" class="guess-input" type="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" name="top5guess_x" placeholder="Type a name…"/></form><div class="suggestions" id="sugg"></div></div><div class="feedback" id="fb"></div>`:''}
    <div id="wrong-wrap">${wrongHtml}</div>
    ${over?`<button class="show-result-btn" onclick="openResult()">📊 VIEW RESULTS</button>`:''}
    <div class="replay-wrap"><button class="replay-btn" onclick="replayConfirm()">↺ RESET DAY</button></div>
    <div class="footer">TOP 5 · Daily Trivia</div>
  </div>`;

  if(!over) wireInput(q);
}

function wireInput(q) {
  const form=document.getElementById('gf'), inp=document.getElementById('gi');
  if(!form||!inp) return;
  inp.focus();
  inp.addEventListener('input',()=>showSugg(inp.value.trim(),q));
  inp.addEventListener('blur',()=>setTimeout(hideSugg,150));
  inp.addEventListener('keydown',e=>{
    const box=document.getElementById('sugg'), items=box?box.querySelectorAll('.sugg-item'):[];
    if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
    else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,-1);items.forEach((el,i)=>el.classList.toggle('active',i===activeIdx));}
    else if(e.key==='Enter'){e.preventDefault();if(activeIdx>=0&&items[activeIdx]){const n=items[activeIdx].dataset.name;inp.value=n;hideSugg();doGuess(n);}else if(inp.value.trim())doGuess(inp.value.trim());}
    else if(e.key==='Escape')hideSugg();
  });
  form.addEventListener('submit',()=>{if(inp.value.trim())doGuess(inp.value.trim());});
}

// ═══════════════════════════════════════════════════════════════
//  GUESS
// ═══════════════════════════════════════════════════════════════

function fb(msg, type) {
  const el=document.getElementById('fb'); if(!el) return;
  el.textContent=msg; el.className='feedback '+type+' show';
  setTimeout(()=>{if(el){el.textContent='';el.className='feedback';}},1800);
}
function shake(){const inp=document.getElementById('gi');if(!inp)return;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),500);}

function trackEvent(payload) {
  try {
    fetch('https://api.top5trivia.com/event', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, user_id: USER_ID, session_id: SESSION_ID })
    }).catch(() => {});
  } catch {}
}

window.openWordBank = function() {
  const q = getQuestion();
  const all = [...(q.pool || [])].sort();
  const answered = new Set(state.revealed.map(i => q.answers[i].name));
  const html = all.map(n => {
    const isAnswer = q.answers.some(a => a.name === n);
    const got = answered.has(n);
    return `<span class="wb-word${isAnswer?' wb-ans':''}${got?' wb-got':''}">${n}</span>`;
  }).join('');
  document.getElementById('wbModal').style.display = 'flex';
  document.getElementById('wbBody').innerHTML = html;
};
window.closeWordBank = function() { document.getElementById('wbModal').style.display = 'none'; };

function doGuess(raw) {
  const q=getQuestion(); if(state.status!=='playing') return;
  hideSugg();
  if(raw.trim()==='/prod1'){
    adminMode=true;
    const inp=document.getElementById('gi'); if(inp){inp.value='';inp.focus();}
    render(); return;
  }
  if(state.wrong.some(g=>g.toLowerCase()===raw.toLowerCase())){fb('ALREADY GUESSED THAT','dupe');shake();return;}
  if(state.revealed.some(idx=>matches(raw,q.answers[idx]))){fb('ALREADY FOUND THAT ONE','dupe');shake();return;}
  const mi=q.answers.findIndex((ans,idx)=>!state.revealed.includes(idx)&&matches(raw,ans));
  if(mi!==-1){
    state.revealed=[...state.revealed,mi];
    if(state.revealed.length===q.answers.length) state.status='won';
    save();
    trackEvent({ event:'guess', q_id:q.id, guess:q.answers[mi].name, correct:true, rank:mi+1 });
    if(state.status==='won'){
      trackEvent({ event:'game_complete', q_id:q.id, score:state.revealed.length, wrongs:state.wrong.length });
      render();setTimeout(openResult,600);return;
    }
    updateBoard();
    const inp=document.getElementById('gi'); if(inp){inp.value='';inp.focus();}
  } else {
    shake(); state.wrong=[...state.wrong,raw]; state.lives-=1; save(); updateLives();
    trackEvent({ event:'guess', q_id:q.id, guess:raw, correct:false });
    if(state.lives===0){
      state.status='lost';save();
      trackEvent({ event:'game_complete', q_id:q.id, score:state.revealed.length, wrongs:state.wrong.length });
      render();setTimeout(openResult,600);return;
    }
    updateWrong(); fb('NOT IN THE TOP 5!','wrong');
    const inp=document.getElementById('gi'); if(inp){inp.value='';inp.focus();}
  }
}

// ═══════════════════════════════════════════════════════════════
//  NAV / REPLAY / SHARE
// ═══════════════════════════════════════════════════════════════

window.navDate = function(dir) {
  const next = offsetFromEpoch(currentDate) + dir;
  currentDate = dateOfOffset(next); state = loadState(getQuestion()); render();
};
window.replayConfirm = function() {
  if(!confirm('Reset this day and start over?')) return;
  state=blank(getQuestion()); save(); render();
};
window.copyShare = async function() {
  const txt = buildShareText();
  try{await navigator.clipboard.writeText(txt);}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
  const btn=document.querySelector('.share-btn');
  if(btn){const orig=btn.textContent;btn.textContent='✓ COPIED!';setTimeout(()=>{btn.textContent=orig;},2500);}
};

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
render();

// live clock — ticks every second, survives re-renders
function tickClock() {
  const el = document.getElementById('headerClock'); if (!el) return;
  const n = new Date();
  el.textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}
setInterval(tickClock, 1000);
tickClock();
</script>
