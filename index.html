<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:    #0f380f;
  --bg2:   #1a4a1a;
  --panel: #0a2a0a;
  --green: #9bbc0f;
  --green2:#8bac0f;
  --dim:   #557a1a;
  --dark:  #071a07;
  --text:  #9bbc0f;
  --pixel: 'Press Start 2P', monospace;
  --strike:#e63946;
  --gold:  #f4d35e;
}

html { zoom: 1.5; }
@media (max-width: 600px) { html { zoom: 1; } }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--pixel);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  image-rendering: pixelated;
}
@media (max-width: 600px) { body { height: 100dvh; } }

.header {
  width: 100%; max-width: 600px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px 10px;
  border-bottom: 2px solid var(--dim);
  flex-shrink: 0;
}
.logo { font-size: 11px; letter-spacing: 2px; color: var(--green); }
.logo span { color: var(--dim); font-size: 8px; }
.header-right { font-size: 7px; color: var(--dim); text-align: right; line-height: 1.8; }
.admin-nav { display: none; align-items: center; gap: 6px; }
.admin-nav.show { display: flex; }
.nav-btn {
  background: none; border: 1px solid var(--dim); color: var(--dim);
  font-family: var(--pixel); font-size: 7px; padding: 4px 8px; cursor: pointer;
}
.nav-btn:hover { border-color: var(--green); color: var(--green); }
.nav-btn a { color: inherit; text-decoration: none; }

.game {
  width: 100%; max-width: 600px;
  padding: 20px 16px 40px;
  display: flex; flex-direction: column; gap: 20px;
}
@media (max-width: 600px) {
  .game { padding: 14px 16px 10px; gap: 12px; flex: 1; overflow: hidden; }
}

.question-label { font-size: 7px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.question-text { font-size: 11px; line-height: 1.9; color: var(--green); border: 2px solid var(--dim); padding: 14px 16px; background: var(--panel); }
@media (max-width: 600px) {
  .question-label { margin-bottom: 6px; }
  .question-text { font-size: 10px; line-height: 1.8; padding: 10px 14px; }
}

.status-bar { display: flex; justify-content: space-between; align-items: center; position: relative; }
#view-results-btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; margin: 0; white-space: nowrap; }
.score-block { display: flex; flex-direction: column; gap: 4px; }
.score-label { font-size: 6px; color: var(--dim); letter-spacing: 2px; }
.score-value { font-size: 22px; color: var(--gold); letter-spacing: -1px; }
.strikes-block { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.strikes-label { font-size: 6px; color: var(--dim); letter-spacing: 2px; }
.strikes-row { display: flex; gap: 8px; }
.strike-slot {
  width: 22px; height: 22px; border: 2px solid var(--dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--dim); transition: all 0.1s;
}
.strike-slot.hit { border-color: var(--strike); color: var(--strike); background: rgba(230,57,70,0.12); animation: strike-pop 0.3s ease; }
@keyframes strike-pop { 0%{transform:scale(1)} 40%{transform:scale(1.4)} 100%{transform:scale(1)} }

.board { display: flex; flex-direction: column; gap: 4px; }
.board-row {
  display: grid; grid-template-columns: 28px 1fr 48px;
  align-items: center; gap: 0;
  border: 2px solid var(--dim); background: var(--panel);
  min-height: 44px; position: relative; overflow: hidden; transition: border-color 0.2s;
}
@media (max-width: 600px) {
  .board { gap: 3px; }
  .board-row { grid-template-columns: 26px 1fr 44px; min-height: 38px; }
}
.board-row.revealed { border-color: var(--green); background: var(--bg2); }
.board-row.revealed .row-num { color: var(--green); border-right-color: var(--green); }
.board-row.revealed .row-pts { color: var(--gold); border-left-color: var(--green); background: var(--dark); }
.board-row.flip-reveal { animation: flip-in 1s ease forwards; }
@keyframes flip-in {
  0%  { transform: perspective(400px) rotateX(-90deg); opacity: 0; }
  60% { transform: perspective(400px) rotateX(10deg); }
  100%{ transform: perspective(400px) rotateX(0deg); opacity: 1; }
}
.score-flash { animation: score-pulse 0.7s ease; }
@keyframes score-pulse { 0%{transform:scale(1)} 40%{transform:scale(1.35);color:#ffd166} 100%{transform:scale(1)} }
.row-num { font-size: 8px; color: var(--dim); text-align: center; border-right: 2px solid var(--dim); height: 100%; display: flex; align-items: center; justify-content: center; transition: color 0.2s, border-color 0.2s; }
.row-answer { padding: 10px 14px; font-size: 9px; line-height: 1.6; letter-spacing: 1px; }
@media (max-width: 600px) {
  .row-answer { padding: 8px 12px; font-size: 8px; line-height: 1.5; }
}
.row-answer.hidden { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.block { display: inline-block; width: 7px; height: 7px; background: var(--dim); }
.row-pts { font-size: 9px; text-align: center; border-left: 2px solid var(--dim); height: 100%; display: flex; align-items: center; justify-content: center; color: var(--dim); transition: color 0.2s, border-color 0.2s; }

.input-row { display: flex; gap: 0; border: 2px solid var(--dim); }
.input-row:focus-within { border-color: var(--green); }
.guess-input { flex: 1; background: var(--panel); border: none; outline: none; color: var(--green); font-family: var(--pixel); font-size: 10px; padding: 12px 14px; caret-color: var(--green); }
.guess-input::placeholder { color: var(--dim); font-size: 8px; }
.submit-btn { background: var(--dim); border: none; color: var(--dark); font-family: var(--pixel); font-size: 7px; padding: 0 14px; cursor: pointer; letter-spacing: 1px; transition: background 0.1s; }
.submit-btn:hover { background: var(--green); }
.submit-btn:active { background: var(--green2); }
@media (max-width: 600px) {
  .submit-btn { display: none; }
  .guess-input { width: 100%; }
  #question-block { order: 1; }
  #input-row      { order: 2; }
  .status-bar     { order: 3; }
  .board          { order: 4; }
  .wrong-flash    { order: 5; }
}

.wrong-flash { font-size: 8px; color: var(--strike); text-align: center; letter-spacing: 1px; min-height: 20px; animation: fade-in 0.2s ease; }
@keyframes fade-in { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.shake { animation: shake 0.5s ease; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(7,26,7,0.92); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal {
  background: var(--panel); border: 3px solid var(--green);
  width: 100%; max-width: 480px; padding: 28px 24px;
  display: flex; flex-direction: column; gap: 20px;
  animation: modal-in 0.3s ease; position: relative;
  max-height: 90vh; overflow-y: auto;
}
@keyframes modal-in { from{transform:scale(0.92);opacity:0} to{transform:scale(1);opacity:1} }
.modal-tag { font-size: 7px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); text-align: center; }
.modal-score { font-size: 56px; font-weight: 400; line-height: 1; letter-spacing: -3px; text-align: center; }
.modal-verdict { font-size: 10px; line-height: 1.8; color: var(--green); text-align: center; }
.modal-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--dim); font-family: var(--pixel); font-size: 14px; cursor: pointer; padding: 4px 6px; line-height: 1; }
.modal-close:hover { color: var(--green); }
.modal-btn { background: var(--green); color: var(--dark); border: none; font-family: var(--pixel); font-size: 8px; padding: 14px; cursor: pointer; letter-spacing: 1px; width: 100%; transition: background 0.1s; }
.modal-btn:hover { background: var(--green2); }
.modal-btn.secondary { background: transparent; color: var(--dim); border: 2px solid var(--dim); margin-top: -8px; }
.modal-btn.secondary:hover { border-color: var(--green); color: var(--green); }

.survey-q { font-size: 9px; line-height: 1.9; color: var(--green); border: 2px solid var(--dim); padding: 12px 14px; background: var(--bg); }
.survey-note { font-size: 7px; color: var(--dim); line-height: 1.8; padding: 0 2px; }
.survey-input-wrap { display: flex; flex-direction: column; gap: 8px; }
.survey-input { background: var(--bg); border: 2px solid var(--dim); color: var(--green); font-family: var(--pixel); font-size: 9px; padding: 12px 14px; outline: none; width: 100%; }
.survey-input:focus { border-color: var(--green); }
.survey-input::placeholder { color: var(--dim); font-size: 7px; }
.survey-thanks { font-size: 8px; color: var(--green); text-align: center; display: none; line-height: 2; }

.modal-btn.secondary.copied { border-color: var(--green); color: var(--green); }
.survey-inline { display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--green); padding: 12px; background: var(--bg); }
.survey-tag { font-size: 7px; color: var(--gold); letter-spacing: 1px; line-height: 1.8; text-align: center; }
.survey-inline .survey-q { border: none; padding: 0; text-align: center; font-size: 10px; line-height: 1.8; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.footer { font-size: 6px; color: var(--dim); padding: 10px 16px 24px; text-align: center; letter-spacing: 1px; max-width: 600px; width: 100%; }
</style>
</head>

// ── Date helpers ─────────────────────────────────────────────────────────────
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
// "Today" is the same day for every player worldwide: the date in New York.
const GAME_TZ = 'America/New_York';
function todayStr() { return new Intl.DateTimeFormat('en-CA', { timeZone: GAME_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function getSurveyForDate(ds) { return SURVEY_SCHEDULE[offsetFromEpoch(ds)] || null; }
function offsetFromEpoch(s) { return Math.round((parseDate(s) - parseDate(EPOCH)) / 86400000); }
function dateOfOffset(n) { const d = parseDate(EPOCH); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function getQuestionForDate(ds) {
  const off = offsetFromEpoch(ds);
  const idx = ((off % QUESTIONS.length) + QUESTIONS.length) % QUESTIONS.length;
  return QUESTIONS[idx];
}

  if (!m) return;
  try { localStorage.setItem('top5_test', m[1] === 'test' ? '1' : '0'); } catch {}
  try {
    Object.keys(localStorage).filter(k => k.startsWith('top5_state_') || k.startsWith('top5_survey_'))
      .forEach(k => localStorage.removeItem(k));
  } catch {}
  history.replaceState(null, '', location.pathname);
})();
const TEST = (() => { try { return localStorage.getItem('top5_test') === '1'; } catch { return false; } })();

  try {
    Object.keys(localStorage).filter(k => k.startsWith('top5_state_') || k.startsWith('top5_survey_'))

  });

function revealRow(idx, awardPts = true) {
  revealed.add(idx);
  const row = document.getElementById(`row-${idx}`);
  if (!row) return;
  row.classList.add('revealed');
  const ans = TODAY.answers[idx];
  row.innerHTML = `<div class="row-num">${idx+1}</div><div class="row-answer">${ans.text}</div><div class="row-pts">${ans.pts}</div>`;
  row.classList.add('flip-reveal');
  row.addEventListener('animationend', () => row.classList.remove('flip-reveal'), { once: true });
  if (awardPts) {
    score += ans.pts;
    // Score counter flash
    const scoreEl = document.getElementById('score-display');
    scoreEl.textContent = score;
    scoreEl.classList.remove('score-flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('score-flash');
    scoreEl.addEventListener('animationend', () => scoreEl.classList.remove('score-flash'), { once: true });
  }
}

// ── Guess logic ───────────────────────────────────────────────────────────────
function normalize(s) { return s.trim().toLowerCase().replace(/[^a-z0-9 ]/g, ''); }

const STOPWORDS = new Set(['the','a','an','and','or','but','is','it','in','on','at','to','do','my','me','i','we','he','she','they','its','was','are','be','of','so','go','get','got','has','had','did','not','for','by','as','up','if','no','ok','yes','yea','yep','nope','lol','hmm','um','uh']);

function variants(ans) { return [normalize(ans.text), ...ans.aliases.map(normalize)]; }

function exactish(ans, g) {
  const wordIn = (hay, needle) => (' ' + hay + ' ').includes(' ' + needle + ' ');
  return variants(ans).some(a =>
    a === g ||
    (g.length >= 4 && (wordIn(a, g) || wordIn(g, a))) ||
    (a.length >= 4 && g.startsWith(a) && g.length <= a.length + 3)
  );
}

function editDistance(a, b) {
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diag = prev[0]; prev[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
      diag = tmp;
    }
  }
  return prev[b.length];
}

// Typos: 1 edit (or one swapped pair, like "kyes") for answers of 4-7 letters, 2 edits for 8+.
// Words under 4 letters must be exact.
function fuzzy(ans, g) {
  return variants(ans).some(a => {
    if (a.length < 4) return false;
    const max = a.length >= 8 ? 2 : 1;
    if (Math.abs(a.length - g.length) > max) return false;
    if (editDistance(a, g) <= max) return true;
    for (let i = 0; i < g.length - 1; i++) {
      if (g.slice(0, i) + g[i + 1] + g[i] + g.slice(i + 2) === a) return true;
    }
    return false;
  });
}

// Returns { idx, dup }: dup is true when the guess matches an answer already revealed.
function findMatch(guess) {
  const g = normalize(guess);
  if (g.length < 3 || STOPWORDS.has(g)) return { idx: -1, dup: false };
  const n = TODAY.answers.length;
  for (const test of [exactish, fuzzy]) {
    for (let i = 0; i < n; i++) if (!revealed.has(i) && test(TODAY.answers[i], g)) return { idx: i, dup: false };
    for (let i = 0; i < n; i++) if (revealed.has(i) && test(TODAY.answers[i], g)) return { idx: i, dup: true };
  }
  return { idx: -1, dup: false };
}

function submitGuess() {
  if (gameOver) return;
  const inp = document.getElementById('guess-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';

  const { idx, dup } = findMatch(val);
  if (dup || (idx < 0 && wrongSeen.has(normalize(val)))) {
    clearWrong();
    const el = document.getElementById('wrong-msg');
    el.textContent = `"${val}" was already guessed`;
    el.style.color = 'var(--green)';
    wrongTimer = setTimeout(() => { el.textContent = ''; }, 2200);
    return;
  }
  if (idx >= 0) {
    revealRow(idx);
    clearWrong();
    trackEvent({ event: 'guess', q_id: TODAY.q_id, guess: TODAY.answers[idx].text, correct: 1, rank: idx + 1 });
    if (revealed.size === TODAY.answers.length) endGame(true);
  } else {
    wrongSeen.add(normalize(val));
    addStrike(val);
    trackEvent({ event: 'guess', q_id: TODAY.q_id, guess: val, correct: 0 });
  }
}

function addStrike(val) {
  strikes++;
  renderStrikes();
  showWrong(val);
  shakeGame();
  if (strikes >= 3) setTimeout(() => endGame(false), 700);
}

function showWrong(val) {
  clearWrong();
  const el = document.getElementById('wrong-msg');
  el.textContent = `"${val}" is not on the board`;
  wrongTimer = setTimeout(() => { el.textContent = ''; }, 2200);
}

function clearWrong() {
  if (wrongTimer) clearTimeout(wrongTimer);
  const wm = document.getElementById('wrong-msg');
  wm.textContent = '';
  wm.style.color = '';
}

function shakeGame() {
  const g = document.getElementById('game');
  g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
  setTimeout(() => g.classList.remove("shake"), 550);
}

// ── End game ──────────────────────────────────────────────────────────────────
function endGame(won) {
  gameOver = true;
  document.getElementById('input-row').style.opacity = '0.3';
  document.getElementById('guess-input').disabled = true;
  document.getElementById('submit-btn').disabled = true;

  trackEvent({ event: 'game_complete', q_id: TODAY.q_id, score, wrongs: strikes, correct: won ? 1 : 0 });

  if (!won) {
    const unrevealed = [4,3,2,1,0].filter(i => !revealed.has(i));
    unrevealed.forEach((i, pos) => setTimeout(() => revealRow(i, false), 150 + pos * 1100));
    setTimeout(() => openResult(false), 150 + unrevealed.length * 1100 + 1500);
  } else {
    setTimeout(() => openResult(true), 1500);
  }
}

function openResult(won) {
  const tiers = [
    [100, ['FLAWLESS.', 'CLEAN SWEEP.', 'UNBEATABLE.']],
    [80,  ['SO CLOSE.', 'NEARLY PERFECT.', 'ALMOST FLAWLESS.']],
    [60,  ['NICE ONE.', 'SOLID GAME.', 'STRONG FINISH.']],
    [40,  ['NOT BAD.', 'RESPECTABLE.', 'HALFWAY THERE.']],
    [20,  ['ROUGH ONE.', 'KEEP AT IT.', 'GETTING THERE.']],
    [0,   ['STRUCK OUT.', 'THE BOARD WINS.', 'OUCH.']],
  ];
  const v = tiers.find(([min]) => score >= min)[1];
  document.getElementById('result-tag').textContent = won ? 'You swept the board' : 'Three strikes';
  document.getElementById('result-verdict').textContent = v[Math.floor(Math.random() * v.length)];
  document.getElementById('result-score').textContent = score;
  document.getElementById('result-score').style.color = score === 100 ? 'var(--green)' : won ? 'var(--gold)' : 'var(--strike)';

  document.getElementById('result-overlay').classList.add('open');
  document.getElementById('view-results-btn').style.display = '';
}

function closeResult() { document.getElementById('result-overlay').classList.remove('open'); }

// ── Share ─────────────────────────────────────────────────────────────────────
function shareResult() {
  trackEvent({ event: 'share_click', q_id: TODAY.q_id, score });
  const d = new Date();
  const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const strikeStr = '✕'.repeat(strikes) + '  '.repeat(3 - strikes);
  const blocks = TODAY.answers.map((_, i) => revealed.has(i) ? '🟩' : '⬛').join('');
  const text = `TOP 5 · Daily Trivia\n${dateStr}\n\nScore: ${score}/100\n${strikeStr}\n${blocks}\n\ntop5trivia.com`;
  const btn = document.getElementById('share-btn');
  copyText(text).then(ok => flashCopied(btn, ok));

  // Phones: open Messages with the result typed out, ready to send.
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPod/.test(ua);
  const isAndroidPhone = /Android/.test(ua) && /Mobile/.test(ua);
  if (isIOS || isAndroidPhone) {
    const body = encodeURIComponent(text);
    window.location.href = isIOS ? `sms:&body=${body}` : `sms:?body=${body}`;
  }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

let copiedTimer;
function flashCopied(btn, ok) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = ok ? 'Copied!' : 'Copy failed, try again';
  btn.classList.toggle('copied', ok);
  clearTimeout(copiedTimer);
  copiedTimer = setTimeout(() => {
    btn.textContent = btn.dataset.label;
    btn.classList.remove('copied');
  }, 2000);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function kpiTile(label, value, color) {
  return `<div style="background:var(--dark);border:1px solid var(--bg2);padding:10px 8px;text-align:center">
    <div style="font-size:18px;line-height:1;color:${color};letter-spacing:-1px">${value}</div>
    <div style="font-size:6px;color:var(--dim);margin-top:5px;letter-spacing:1px;text-transform:uppercase">${label}</div>
  </div>`;
}

async function openStats() {
  trackEvent({ event: 'stats_click', q_id: TODAY.q_id });
  document.getElementById('result-overlay').classList.remove('open');
  document.getElementById('stats-overlay').classList.add('open');

  document.getElementById('stats-your-score').textContent = score;
  document.getElementById('stats-your-score').style.color =
    score === 100 ? 'var(--green)' : score > 0 && strikes < 3 ? 'var(--gold)' : 'var(--strike)';

  renderDist();

  // Career from localStorage
  const career = getCareer();
  document.getElementById('stats-career').innerHTML =
    kpiTile('Played',      career.played,                    'var(--green)') +
    kpiTile('Avg score',   career.played ? Math.round(career.totalScore / career.played) : '—', 'var(--gold)') +
    kpiTile('Best score',  career.best || '—',               'var(--gold)') +
    kpiTile('Wins',        career.wins,                      'var(--green)') +
    kpiTile('Streak',      career.streak,                    'var(--green)') +
    kpiTile('Best streak', career.bestStreak,                'var(--green)');
}

// Smoothed score distribution of today's players, with a marker for you.
async function renderDist() {
  const box = document.getElementById('stats-dist');
  box.innerHTML = '';
  let rows = [];
  try {
    const r = await fetch('https://api.top5trivia.com/stats/today?q_id=' + encodeURIComponent(TODAY.q_id));
    rows = await r.json();
  } catch {}
  // In test mode nothing was recorded for you, so we never count you in the totals.
  const total = rows.reduce((a, r) => a + r.n, 0);
  if (!Array.isArray(rows) || total < 5) {
    box.innerHTML = '';
    box.style.minHeight = '0';
    return;
  }
  const W = 300, H = 110, PAD = 8, BASE = 92, TOP = 10, BW = 7;
  const xs = v => PAD + (v / 100) * (W - 2 * PAD);
  const dens = [];
  for (let v = 0; v <= 100; v += 2) {
    let d = 0;
    for (const r of rows) d += r.n * Math.exp(-0.5 * ((v - r.score) / BW) ** 2);
    dens.push([v, d]);
  }
  const max = Math.max(...dens.map(d => d[1]));
  const ys = d => BASE - (d / max) * (BASE - TOP);
  const pts = dens.map(([v, d]) => [xs(v), ys(d)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${xs(100)} ${BASE} L${xs(0)} ${BASE} Z`;
  const you = Math.max(0, Math.min(100, score));
  let yd = 0; for (const r of rows) yd += r.n * Math.exp(-0.5 * ((you - r.score) / BW) ** 2);
  const yx = xs(you), yy = ys(yd);
  const below = rows.filter(r => r.score < you).reduce((a, r) => a + r.n, 0);
  const pct = Math.round(below / total * 100);
  const ticks = [0, 25, 50, 75, 100].map(t =>
    `<line x1="${xs(t)}" y1="${BASE}" x2="${xs(t)}" y2="${BASE + 4}" stroke="#306230"/>` +
    `<text x="${xs(t)}" y="${BASE + 15}" text-anchor="middle" fill="#8bac0f" font-size="7" font-family="inherit">${t}</text>`).join('');
  const label = `BETTER THAN ${pct}% OF TODAY'S PLAYERS`;
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
      <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9bbc0f" stop-opacity=".45"/><stop offset="1" stop-color="#9bbc0f" stop-opacity=".05"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#dg)"/>
      <path d="${line}" fill="none" stroke="#9bbc0f" stroke-width="2" stroke-linejoin="round"/>
      <line x1="${xs(0)}" y1="${BASE}" x2="${xs(100)}" y2="${BASE}" stroke="#306230"/>
      <line x1="${yx}" y1="${yy}" x2="${yx}" y2="${BASE}" stroke="#f4d35e" stroke-width="2"/>
      <circle cx="${yx}" cy="${yy}" r="4" fill="#f4d35e"/>
      ${ticks}
      <text x="${Math.max(14, Math.min(W - 14, yx))}" y="${yy - 9}" text-anchor="middle" fill="#f4d35e" font-size="8" font-family="inherit">YOU</text>
    </svg>
    <div class="modal-tag" style="margin-top:6px;color:var(--gold);line-height:1.8">${label}</div>`;
}

function closeStats() { document.getElementById('stats-overlay').classList.remove('open'); }

// ── Career (localStorage) ─────────────────────────────────────────────────────
function getCareer() {
  try { return JSON.parse(localStorage.getItem('top5_career') || '{}'); } catch { return {}; }
}
function saveCareerResult(won) {
  if (TEST) return;
  try {
    const c = getCareer();
    c.played     = (c.played || 0) + 1;
    c.totalScore = (c.totalScore || 0) + score;
    c.best       = Math.max(c.best || 0, score);
    c.wins       = (c.wins || 0) + (won ? 1 : 0);
    c.streak     = won ? (c.streak || 0) + 1 : 0;
    c.bestStreak = Math.max(c.bestStreak || 0, c.streak);
    localStorage.setItem('top5_career', JSON.stringify(c));
  } catch {}
}

// ── Survey ────────────────────────────────────────────────────────────────────
function surveyKey() { return SURVEY_Q ? 'top5_survey_' + SURVEY_Q.id : null; }

function setupSurvey() {
  const box = document.getElementById('survey-inline');
  if (!box) return;
  if (!SURVEY_Q) { box.style.display = 'none'; return; }
  box.style.display = '';
  document.getElementById('survey-question-text').textContent = SURVEY_Q.text;
  let done = false;
  try { done = !!localStorage.getItem(surveyKey()); } catch {}
  document.getElementById('survey-answer').value = '';
  document.getElementById('survey-form').style.display = done ? 'none' : '';
  document.getElementById('survey-thanks').style.display = done ? 'block' : 'none';
}

async function submitSurvey() {
  const val = document.getElementById('survey-answer').value.trim();
  if (!val || !SURVEY_Q || val.startsWith('/')) return;

  // POST to worker
  trackEvent({ event: 'survey_submit', q_id: TODAY.q_id });
  if (!TEST) try {
    fetch('https://api.top5trivia.com/survey', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        q_id: TODAY.q_id,
        survey_q_id: SURVEY_Q.id,
        survey_q: SURVEY_Q.text,
        survey_date: DAY_STR,
        board_date: dateOfOffset(offsetFromEpoch(DAY_STR) + 7),
        answer: val,
        user_id: USER_ID,
      }),
    }).catch(() => {});
  } catch {}

  if (!TEST) try { localStorage.setItem(surveyKey(), '1'); } catch {}
  document.getElementById('survey-form').style.display = 'none';
  document.getElementById('survey-thanks').style.display = 'block';
}

// ── Persist today's game to localStorage ─────────────────────────────────────
function saveGameState(won) {
  try {
    localStorage.setItem('top5_state_' + todayStr(), JSON.stringify({
      score, strikes, won,
      revealed: [...revealed],
    }));
  } catch {}
}

function loadGameState() {
  try {
    return JSON.parse(localStorage.getItem('top5_state_' + todayStr()) || 'null');
  } catch { return null; }
}

// Hook endGame to persist state + save career stats
const _endGame = endGame;
window.endGame = function(won) {
  _endGame(won);
  saveGameState(won);
  saveCareerResult(won);
};

// ── Boot ──────────────────────────────────────────────────────────────────────
init();

// After init, check if player already completed today's game
(function() {
  const saved = loadGameState();
  if (!saved) return;

  // Restore board state silently
  score   = saved.score;
  strikes = saved.strikes;
  gameOver = true;
  for (const i of saved.revealed) revealed.add(i);

  // Rebuild board with revealed rows (no animation)
  document.getElementById('score-display').textContent = score;
  renderStrikes();
  const toShow = saved.won ? saved.revealed : [0,1,2,3,4];
  for (const i of toShow) {
    const row = document.getElementById('row-' + i);
    if (!row) continue;
    const ans = TODAY.answers[i];
    row.classList.add('revealed');
    row.innerHTML = `<div class="row-num">${i+1}</div><div class="row-answer">${ans.text}</div><div class="row-pts">${ans.pts}</div>`;
  }

  // Disable input
  document.getElementById('guess-input').disabled = true;
  document.getElementById('input-row').style.opacity = '0.3';

  // Show result modal immediately, they already played today
  openResult(saved.won);
  // Show "view results" button in status bar
  const viewBtn = document.getElementById('view-results-btn');
  if (viewBtn) viewBtn.style.display = '';
})();
</script>
<script>
// ── Desktop fit-to-window ────────────────────────────────────────────────────
// Desktop uses zoom 1.5 by default; shrink it just enough that header, board,
// answer box and footer all fit in the window. Phones (≤600px) are untouched.
(() => {
  const MAX_ZOOM = 1.5, MIN_ZOOM = 1;
  const mobile = window.matchMedia('(max-width: 600px)');
  const root = document.documentElement, body = document.body;
  const parts = ['.header', '#game', '.footer'].map(s => document.querySelector(s));
  let queued = false;

  function fit() {
    queued = false;
    if (mobile.matches) { root.style.zoom = ''; body.style.height = ''; return; }
    root.style.zoom = 1;
    body.style.height = 'auto';
    const natural = parts.reduce((h, el) => h + (el ? el.offsetHeight : 0), 0);
    const z = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, (window.innerHeight - 4) / natural));
    root.style.zoom = z;
    body.style.height = (window.innerHeight / z) + 'px';
  }
  const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(fit); } };

  fit();
  window.addEventListener('resize', schedule);
  mobile.addEventListener('change', schedule);
  if (document.fonts) document.fonts.ready.then(schedule);
  new MutationObserver(schedule).observe(document.getElementById('game'),
    { subtree: true, childList: true, characterData: true, attributes: true });
})();
</script>
